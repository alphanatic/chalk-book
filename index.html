<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalk Book</title>
<link rel="icon" href="site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="chalk-pastel.css">
<link rel="stylesheet" href="site/site-theme.css">
<link rel="stylesheet" href="site/app.css">
</head>
<body class="left-collapsed rail recent-rail">

<header class="topbar">
  <div class="topbar-rail">
    <!-- Menu button: three chalk sticks lying down -->
    <button class="icon-btn" id="menu-btn" type="button" aria-label="Collapse or expand the notes menu"
      aria-controls="nav-menu" aria-expanded="true">
      <svg class="chalk-sticks" viewBox="0 0 24 24" aria-hidden="true">
        <rect class="pink" x="3" y="5" width="18" height="3.4" rx="1.7"/>
        <rect class="butter" x="4.5" y="10.3" width="16" height="3.4" rx="1.7"/>
        <rect class="sky" x="3.5" y="15.6" width="17" height="3.4" rx="1.7"/>
      </svg>
    </button>
  </div>
  <span class="brand"><chalk-wordmark></chalk-wordmark></span>
  <span class="current" id="current"></span>
  <!-- Export: a small menu of ways to take the open note elsewhere. Mail options can join later -->
  <div class="export">
    <button class="btn" id="export-btn" type="button" aria-haspopup="menu" aria-expanded="false"
      aria-controls="export-menu" disabled>
      Export
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
    </button>
    <div class="export-menu" id="export-menu" role="menu" hidden>
      <button class="export-item mint" id="save-pdf" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M12 11v6m-3-3 3 3 3-3"/></svg>
        Save as PDF
      </button>
    </div>
  </div>
  <!-- Recently viewed button: a chalk clock, centred over the right rail -->
  <div class="topbar-rail right">
    <button class="icon-btn" id="recent-btn" type="button" aria-label="Show or hide recently viewed"
      aria-controls="recent" aria-expanded="false" title="Recently viewed">
      <svg class="chalk-clock" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.6"/>
        <rect class="butter" x="10.7" y="6" width="2.6" height="7.3" rx="1.3"/>
        <rect class="pink" x="10.7" y="10.7" width="6" height="2.6" rx="1.3"/>
      </svg>
    </button>
  </div>
</header>

<!-- Left: search on top, then every note grouped by project. Collapses to a rail of numbers -->
<nav class="panel left" id="nav-menu" aria-label="Notes">
  <div class="panel-body">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="search" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false"
        aria-label="Search inside every note">
      <kbd>/</kbd>
    </label>
    <!-- Shown instead of the field when the menu is a rail: a diagonal chalk stick -->
    <button class="file search-rail" id="search-rail" type="button" title="Search inside every note" aria-label="Search">
      <svg class="chalk-stick" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="9.6" y="2.5" width="4.8" height="19" rx="2.1" transform="rotate(45 12 12)"/>
        <rect class="tip" x="9.6" y="2.5" width="4.8" height="4" rx="2.1" transform="rotate(45 12 12)"/>
      </svg>
    </button>
    <div id="find-list" hidden></div>
    <div id="menu-list"></div>
    <p class="panel-foot" id="menu-foot"></p>
  </div>
</nav>

<main class="view">
  <section class="home" id="home">
    <h1><chalk-wordmark></chalk-wordmark></h1>
    <p id="home-stats"></p>
    <p class="hint">Pick a note from the menu, or press <kbd>/</kbd> to search inside every note.</p>
  </section>
  <iframe id="frame" title="Note" hidden></iframe>
</main>

<!-- Right: recently viewed notes, styled as the menu's mirror image -->
<aside class="panel right" id="recent" aria-label="Recently viewed">
  <div class="panel-body">
    <div id="recent-list"></div>
    <p class="panel-foot" id="recent-foot"></p>
  </div>
</aside>
<!-- Main footer: persistent on every page, links to the site's own pages; it grows with its contents -->
<footer class="main-footer" aria-label="Main footer">
  <nav aria-label="Main">
    <ul>
      <li><a class="main-footer-btn" href="#" data-page="">Home</a></li>
      <li><a class="main-footer-btn" href="#backlog" data-page="backlog">Backlog</a></li>
      <li><a class="main-footer-btn" href="#complete" data-page="complete">Complete Tasks</a></li>
      <li><a class="main-footer-btn" href="#contact" data-page="contact">Contact</a></li>
      <li><a class="main-footer-btn" href="https://github.com/alphanatic/chalk-book" target="_blank" rel="noopener">GitHub</a></li>
      <li><a class="main-footer-btn" href="https://claude.ai/new#settings/usage" target="_blank" rel="noopener">claude.ai</a></li>
      <li><a class="main-footer-btn" href="https://eu-north-1.console.aws.amazon.com/ec2/home?region=eu-north-1#" target="_blank" rel="noopener">aws or</a></li>
    </ul>
  </nav>
</footer>
<div class="scrim" id="scrim"></div>

<script src="site/notes.js"></script>
<script src="site/search-index.js"></script>
<script src="site/app.js"></script>
</body>
</html>
