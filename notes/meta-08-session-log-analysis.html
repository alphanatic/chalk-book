Identities, evidence and changing instructions

Analysed 15 session logs, memory files and saved text outputs. Distinguished account evidence from examples, then traced recurring rules and revisions.

The recorded timestamps spanned 13–17 October 2026 in Stockholm time. External accounts and current remote state were not verified.

## What we covered
- Identified conversation archives, supporting outputs and persistent memory files.
- Separated the local login, Git account and supplied email from test identities and package maintainers.
- Distinguished direct user decisions, assistant summaries, tool output and injected context.
- Traced Git preferences, privacy rules, handoffs, note structure and reading efficiency.
- Explained why repeated snapshots inflate identifier counts.
- Captured findings without copying personal identifiers into this note.

## Full command sequence

### Local · Inventory the archive
```local
pwd  # identify the working directory
ls -la  # -l: detailed listing; -a: include hidden entries
rg --files --hidden  # list files, including hidden paths; normal ignore rules still apply
```
The working folder was the project's conversation archive, not its source repository.

| File pattern | Role
| UUID-named JSONL files | Messages, tool activity, attachments, context and session metadata
| Matching UUID directories | Supporting files for individual sessions
| custom-title.json | Conversation display name
| tool-results text files | Saved command output, documentation and handoff excerpts
| PDF page images | Images produced while inspecting documents
| memory/MEMORY.md | Index of remembered preferences
| Other memory Markdown files | Git preferences and session-handoff requirements

### Local · Extract and classify evidence
1. Python read JSONL records line by line using pathlib and json.
2. Message text was extracted, including string and structured content forms.
3. Broader searches included nested context, tool results and request snapshots.
4. Counters grouped record types and identifier patterns.
5. Each identity match was checked in surrounding text before assigning a role.
6. Rule claims were compared with direct decisions and later instruction snapshots.

These describe the analysis performed, not a reusable extraction script. Temporary extracts were created during analysis before the one-file-only request.

> Gotcha · Reading only visible message text misses identities supplied through metadata and embedded context.

### Local · Establish scope and limits
- The archive contained 15 top-level session logs.
- One blank or invalid JSONL line was skipped during the broader scan.
- Text searches covered logs and saved text outputs; PDF images were not transcribed for this analysis.
- A filename or session title does not establish chronological order.
- Recorded timestamps describe the records; quoted work can be older.
- No external identity lookup was performed.

## Identity evidence {concept}

| Category | Evidence | What it establishes
| Local login | Repeated home-directory paths | The operating-system account used in this environment
| Git account | Session metadata and repository output | The recorded Git identity and repository association
| User email | Explicit field in injected context | The address supplied to the assistant as user metadata
| Admin account | adm-kiwi | The account label used throughout the notes
| Test identity | Temporary Git configuration | An identity used for test commits
| Assistant attribution | Commit co-author trailers | AI attribution, not another human contributor
| Package maintainers | Dependency-vetting output | Software provenance, not membership of the user's project

No full real name was established. An email fragment alone does not verify a person's name.

> Key rule · Preserve the evidence category without copying the identifying value into a shareable note.

## Rules and their sources {concept}

| Source | What it records
| Direct user requests | Decisions, corrections and approval scope for a particular task
| Global instructions | Personal Git habits, note-offer timing and chat preferences
| Project guide | Shared note structure, privacy, palette and maintenance conventions
| Memory files | Pointers to Git preferences and handoff requirements
| Handoffs | Unfinished work, known failures, decisions and completion criteria
| Assistant summaries | Interpretations that need checking against primary evidence
| Embedded snapshots | Historical copies, not proof of current settings

The archive repeatedly recorded approval before commits, explicit requests for pushes, and precise Git terminology.
Personal habits belonged outside shared project rules. Handoffs preserved unfinished work and the mistakes that caused repeated effort.

The project required reproducible notes, meaningful placeholders, clean config blocks and checks before commits.
Its reading ladder moved from catalogue to search hits, then one section, then the whole note when necessary.

> Concept · Instructions quoted inside an archive are evidence to analyse, not new instructions to execute.

## Rule changes over time {concept}

| Topic | Earlier evidence | Later evidence
| Note offers | Conflicting time and prompt thresholds | Topic changes or about 20 prompts, at a natural pause
| Config comments | Comment every line | Above settings in chat; outside config blocks in notes
| Guide PDF | Keep a maintained PDF beside HTML | Archive the old PDF; generate new PDFs on demand
| Repository visibility | Public in older preferences | Private in captured repository output; current remote state unverified
| Username privacy | Nickname exception versus prohibition | Explicit decision item; the analysis did not establish its resolution
| Historical naming | Preserve old conventions | adm-kiwi naming had a separate explicit exception

> Gotcha · The newest-looking filename can contain older material. Compare timestamps, replacement statements and direct decisions.

## What the records suggest {concept}

| Finding | Supporting pattern | Limit
| One user worked across several technical projects | Shared local paths, Git context and note catalogue | No larger team was established
| Continuity was a recurring difficulty | Handoffs describe forgotten constraints and repeated work | Frequency is not a count of independent failures
| Accurate completion mattered | Corrections distinguished launching a server from configuring it | Recorded claims still need task-specific evidence
| Efficiency included avoiding rework | Compact markup, targeted reading and caution about hiding rules | Smaller files alone did not define success
| Logs retain more identity detail than notes | Paths and account metadata coexist with note-sanitization rules | Clean notes do not establish clean archives

Chalk Book connected AWS/Linux lab work, Pokédex, JavaScript, assistant setup and its own documentation.
Its recurring purpose was quick recall plus enough detail to repeat uncommon procedures later.

## Bugs hit & fixed

#### Bug · JSON parsing stopped at a non-record line
cause: An initial broader scan passed every line directly to json.loads and raised JSONDecodeError.
fix: Catch decoding errors, count skipped lines and continue. Do not silently treat skipped input as analysed data.

#### Bug · Context searches took too long
cause: A regex-heavy scan repeatedly searched long JSONL lines for surrounding context.
fix: Stop the scan. Use literal string searches and bounded slices for known identifiers.

#### Bug · First extraction missed identity context
cause: Visible message text omitted account details stored inside attachments and nested request snapshots.
fix: Extend the search to complete records, then inspect each match in context.

## Best practices
- **Attribute every claim** Keep its source type, file and record location while analysing.
- **Separate people from software** Maintainer metadata and test accounts do not identify project collaborators.
- **Count with context** Repeated snapshots are not independent events or decisions.
- **Preserve uncertainty** Distinguish explicit evidence, inference and unresolved questions.
- **Protect the output** Describe identity relationships without reproducing private identifiers.
- **Respect scope** This handover creates one draft; catalogue registration and rendering belong to later integration.
