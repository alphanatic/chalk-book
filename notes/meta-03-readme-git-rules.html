## Repo rules vs personal rules

{keep}
| Where | Binds | Holds
| `CLAUDE.md` §7 (repo) | Anyone who works on the repo | Follow the user's own git preferences; if none, ask. Use git's exact terms. Messages have a title and a body
| `~/.claude/CLAUDE.md` (global) | One person, every project | Ask before each commit. Never push unasked. Titles of key words only, like note titles
| Project memory | One person, this project | Points to the global file; restates nothing
> Concept · Personal habits in a repo file bind the next contributor too. Keep the repo neutral and let each person's own settings fill in the rest. Personal preferences come first, Claude's defaults second.

### Git wording
| Term | Command | What it does
| stage | `git add` | Picks the changes for the next commit
| commit | `git commit` | Saves a snapshot locally, with a message
| amend | `git commit --amend` | Rewrites the latest commit. Safe only before it is pushed
| push | `git push` | Sends local commits to GitHub
| pull | `git pull` | Fetches and merges commits from GitHub
| revert / reset | `git revert` · `git reset` | Undo with a new commit · move the branch back
> Key rule · If a request doesn't map clearly to one git action, ask. Offer 1–3 options, each with its command and one line on what it does.

### Local · Relabel an unpushed commit, then push
```local
git log --oneline -2                    # check the commit to relabel is the latest one
git stash                               # park uncommitted changes so the amend leaves them out
git commit --amend -m "README & ..."   # --amend: replace the latest commit
git stash pop                           # bring the parked changes back
git status -sb                          # -s: short, -b: branch line, shows "ahead 3"
git push                                # only after the user asked for it
```

## Bugs hit & fixed

#### Bug · "Don't commit" taken literally
cause: "I do not want you to commit anything any more" was read as "never commit". It could also mean "never push" or "ask first".
fix: Offered three options with a line each. The answer was **ask before each commit**. The **Git wording** rule now makes asking the default for unclear git requests.

#### Bug · Personal git habits in the repo
cause: `CLAUDE.md`, the skill and the guide all said "commit locally, push only when asked". That is one person's habit, and it bound anyone else who works on the repo.
fix: The repo now only says to follow the user's own preferences. The habit itself moved to the global `~/.claude/CLAUDE.md`.

#### Bug · Message style read as design
cause: "Like my note titles" was turned into Title Case, `&` joins and a word count.
fix: It means only: key words that best capture the content. Anything unstated follows the user's preferences first, Claude's defaults second.

## Best practices

- **Ask, don't guess** An unclear git request gets 1–3 options, each with its command.
- **Amend before pushing** Rewriting a commit is safe only while it is local.
- **Neutral repo** Repo files say what anyone needs; personal habits live in personal settings.
- **Timestamp done** A Done chip carries the date and time it was marked.
