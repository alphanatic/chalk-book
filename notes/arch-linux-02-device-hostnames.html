A four-part name for personal machines
Set a hostname convention for personal laptops, desktops and servers, modelled on the cloud naming pattern. The first name under it is `ltp-crit-agi-01`.

This note is a reference, not a walkthrough. The cloud rules stay in [[tinker-town-05-naming-conventions]].

## What we covered
- Pattern `<type>-<owner>-<site>-<nn>`, mirroring the cloud `<type>-<workload>-<env>-<region>-<instance>`
- Three-letter types `ltp`, `dsk`, `srv`, chosen by preference, not taken from a standard
- Site slot kept for later, filled with `agi` (agile) while there is no fixed site
- No OS or hardware model in the name, so it stays true across reinstalls and upgrades

## The pattern
```concept
ltp-crit-agi-01
```

{keep}
| Segment | Meaning | Values
| `type` | What kind of machine | `ltp` laptop, `dsk` desktop, `srv` physical server
| `owner` | Whose it is | `crit`
| `site` | Home base, where it is registered | `agi` (agile: no fixed site); a place code like `sto` later
| `nn` | Counter, two digits | `01`, `02` … never reused, even after a machine is gone

{keep}
| Cloud (CAF) | Personal | Why
| `vm` | `ltp` / `dsk` / `srv` | CAF only covers cloud resources; no standard exists for physical machines
| workload | owner | A personal machine's purpose changes; its owner doesn't
| env | dropped | Personal machines have no dev or prod
| region `eun1` | site `agi` | Same slot; a laptop keeps its home base when it travels
| instance `001` | `01` | Two digits are enough for personal machines

> Key rule · Hostnames use only lowercase letters, digits and `-`.
> Concept · Common prefixes seen in IT: `lt`, `lap`, `nb` for laptops; `dt`, `ws`, `wks`, `pc` for desktops; `srv`, `svr` for servers. Only `srv` is close to universal.
> Gotcha · `dtp` reads as "desktop publishing", so desktops use `dsk`. `agi` may be read as AGI; fine for private names.

{keep}
## Machines
| Hostname | Machine
| `ltp-crit-agi-01` | ASUS ROG Strix GL702VT laptop, Arch, 2026-10-18
| `dsk-crit-agi-01` | The desktop, if renamed from <span class="old">arch-crit</span>

> Naming note · The desktop is still <span class="old">arch-crit</span> (os-owner, from before this convention). Rename it only on purpose.

{keep}
## Best practices
- **Name what doesn't change** Type and owner stay true; OS, model and purpose don't.
- **Keep empty slots** A placeholder like `agi` keeps every name the same shape, so a real site code can drop in later.
- **Never reuse numbers** A retired `ltp-crit-agi-01` keeps its number; the next laptop is `02`.

Part of Arch Linux · see [[arch-linux-01-laptop-install]] for where it was first used
