Rules that a script enforces, not memory

Wrote a privacy rule into `CLAUDE.md` and masked every admin account as `adm-kiwi`, in notes and archived PDFs alike. Built `check.sh`, which every commit must pass.

Backlog items 1 and 2 are done. Every later note is checked by the same script before it is committed.

## What we covered

- A privacy rule in `CLAUDE.md` §4: real by default, except access, location and private life
- Every admin account written as `adm-kiwi`, live or test, with no placeholder and no explanation
- Swapped text inside archived PDFs with PyMuPDF, in each PDF's own font
- `check.sh`: one command for placeholders, colours, secrets, IPs, emails, admin names and the catalogue
- An optional private block list outside the repo, for words no general check can recognise
- Workflow rules: commit locally, push only when asked, ask before marking a backlog item done
- Backlog: item 25 added (legends that match the page), items 1 and 2 marked done

## The privacy rule

{keep}
| Kind | Rule | Example
| **Access** | Never written, not even partly masked | keys, passwords, tokens, recovery codes
| **Location** | Becomes a `<what-it-is>` placeholder | `<instance-ip>`, `<my-ip>`, `<vpc-id>`
| **Private life** | Left out; when in doubt, ask | real name, home address, job search, health
| **Admin accounts** | Always `adm-kiwi`, never a name or a pattern | `ssh adm-kiwi@<instance-ip>`
> Concept · Private ranges (`10.0.0.0/16`), `0.0.0.0/0` and role accounts such as `svc-disk-report` are fine. They don't identify a person or a host on the internet.

---
> Gotcha · A pushed commit can't be fully taken back. GitHub may still serve it by its hash after a force-push. Keep private data out *before* the first commit.

## Bugs hit & fixed

#### Bug · check.sh printed problems but said "all checks passed"
cause: `grep … | report` runs `report` in a subshell. Its `problems=$((problems+1))` was lost when the pipe ended.
fix: Count failures in a file instead, and read the count at the end.
```local
fail() { echo "  $1"; echo x >> "$tmp/problems"; }                    # survives the subshell
problems=0; [ -f "$tmp/problems" ] && problems=$(wc -l < "$tmp/problems")
```

#### Bug · clean run exited 1 with no summary
cause: `cat missing-file | wc -l` fails, and `set -euo pipefail` stops the script there.
fix: Test that the file exists before counting (the line above).

#### Bug · swapped PDF text came out tiny, on grey boxes
cause: The redaction's replacement text used a built-in PDF font at a fitted size, and the default fill was grey.
fix: Restore the backups, redact with the sampled background colour, then draw the new text with `insert_text` in the original font file, size and colour.

#### Bug · check.sh flagged CLAUDE.md itself
cause: The rule's own wording showed the forbidden pattern as an example.
fix: Reworded it to "never a placeholder", so the repo never shows the pattern at all.

#### Bug · zsh: ==REAL not found
cause: In zsh, a word starting with `=` expands to a command's path, so `echo ===REAL` fails.
fix: Quote it, `echo "===REAL"`, or use another marker.
