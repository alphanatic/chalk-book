Purpose, structure & conventions

A personal technical chalk book. After a session of problem-solving, building or learning with an AI, the work is distilled into one calm, skimmable note that can be revisited later for a fast refresher, on a small local site or as a PDF.

This is the read-only copy of `CLAUDE.md`, which is the source of truth.

## Purpose {best}

- **Capture** recent work while it is fresh: commands, configs, decisions, mistakes.
- **Revisit** it later and get the gist in under a minute.
- **Repeat** it cold, months later, without re-researching anything.
- **Trace** what was done, per project and date, so a future AI can recall which scenarios have been worked through.

## Anatomy of a note

```html
<p style="margin:0 0 6px">Every note follows the same top-to-bottom shape, so the eye always knows where to look.</p>
```

1. **Header band**: eyebrow chip `PROJECT TINKER TOWN · 03 · MODULE 1 · 2026-08-30`, title words coloured blue, pink, green, yellow in turn, a short subtitle, and a 1–2 sentence past-tense summary.
2. **What we covered**: a ✓ checklist of outcomes, complete enough to stand in for the note.
3. **Full command sequence**: steps under short headings, each tagged <span class="tag local">Local</span> or <span class="tag remote">Remote</span>
4. **Supporting sections**: concepts, diagrams, field tables, quick-reference tables.
5. **Bugs hit & fixed**: one card per real error, **Cause** → **Fix**.
6. **Where things live** and **Best practices** (short cards) as needed.
7. **Part of** line: the project, with links to related notes through the site.
8. **Footer** on printed pages: `Tinker Town 03 — Systemd Service · 1 / 3`

```html
<p style="margin:6px 0 0">Notes are written in <b>chalk markup</b>: compact text that <code>note.js</code> turns into this shape in the browser, with no build step. The syntax is at the top of <code>note.js</code>; the template shows every part. Header and footer are made for you; notes have no legend, since each block's tag and label already say what it is. The standard headings get ids: <code>covered</code>, <code>steps</code>, <code>bugs</code>, <code>paths</code>, <code>practices</code>.</p>
```

## Writing style {local}

- **Skim first.** Headings, checklists and tables carry the story; prose only fills gaps.
- **Short.** Sentences under ~20 words. No intro paragraphs, no filler.
- **Every command gets a comment** explaining what it does and what each flag means.
- **Config files stay clean.** Annotations sit beside the file or in a field table, never inside it.
- **Real by default, except access, location and private life.** Actual commands, paths and error messages, but: no keys, passwords or tokens; placeholders such as `<instance-ip>` for public IPs, account IDs and emails; nothing about the user's private life. `critonite` and `kiwi` are the owner's known aliases (`crit` in hostnames) and may appear; any other name of a person becomes a made-up cartoony or fruity one, like `mango`, never `kiwi`. Anything that looks like an admin account is always `adm-kiwi`: never a name, never a placeholder, live or test.
- **Keep the mistakes.** Errors and their fixes are often the most valuable part.
- **Trim output.** Keep the few lines of output or log that matter, never the whole dump.
- **Respect history.** When a convention changes, mark old names as legacy instead of rewriting earlier notes.
- **Calm tone.** Plain, friendly and factual. No hype, no emoji.

```remote
sudo mkdir -p /mnt/data  # -p: create parents, no error if it exists
```

> Gotcha · Many config formats break on inline comments. That is why config blocks are never annotated inside the block itself.

### The site
- `index.html` opens straight from disk, no build step. How it looks and behaves is in the code and in `meta-01-site-build`.

## How notes are made & changed {gotcha}

> Concept · The notes are **read-only by design**. Nobody edits a note in a viewer; every change goes through an AI session.

### Adding a note: the memory-dump skill
1. Work on something, in any project folder.
2. While it is fresh, say **“memory-dump”** or **“chalk that up”**. A personal pointer skill makes this work in every folder. An AI may also offer a dump; when is each user's own preference.
3. The skill plans the notes, fills the template in `notes/`, adds them to `site/notes.js`, rebuilds the search index, runs `check.sh` and checks every page, then hands over following the user's own git preferences.
4. Check the note on the site and ask for any changes in the same session.

### Changing a note or this guide
- Ask for the change in a session. The AI edits the note's markup or `CLAUDE.md`.
- Note PDFs are made on demand from the site; the originals from before the HTML rebuild and the last guide PDF are kept in `archive/`.

### Local · Rendering and checks
```local
.claude/skills/memory-dump/render.sh notes/<name>.html [out-dir]   # → <name>.pdf
.claude/skills/memory-dump/check.sh [--render]                      # must pass before every commit
```

## Rules for AI assistants

- Read `CLAUDE.md` before creating or changing anything in the chalk book.
- Use the `memory-dump` skill to make notes, and `chalk-pastel.css` for every colour.
- Match the existing notes' structure and look exactly; open one as a reference if unsure.
- **Read little first.** To find something, stop at the first step that answers it: the catalogue in `site/notes.js`, then hits with context in `site/search-index.js`, then one section (from `## Bugs` to the next `##`), and the whole note only when the task needs all of it.
- Never edit, rename or delete an existing note or archived PDF unless the user asks.
- Keep `CLAUDE.md` and this guide's HTML in sync, and change them only when the user asks.
- Keep private data out *before* it is committed: GitHub may still serve a pushed commit after a force-push. If something slips through, tell the user; don't rewrite history without asking.
- **Git follows the person.** Committing, pushing and commit-message style come from the current user's own instructions, never from this guide. If none are given, ask before any git action.
- **Git wording.** Use git's own terms exactly: *stage*, *commit*, *push*, *pull*, *revert*, *reset*. If a request doesn't map clearly to one git action, ask, offering 1–3 options with a short description each.
- **Commit messages document the work:** a title, then a body saying what changed and why.
