archinstall on an ASUS ROG laptop, copied from the desktop
Installed Arch on an ASUS ROG Strix GL702VT (2016) with archinstall, with every choice copied from the desktop `arch-crit`. HyDE then put the desktop on top.

The choices are saved by archinstall as a config file, so the next install can replay them with one command.

## What we covered
- Desktop setup read first: disk layout, bootloader, services, locale and packages, to copy onto the laptop
- Boot menu on ASUS ROG: `Esc` at power-on; BIOS: `F2` (Secure Boot and Fast Boot off)
- Laptop disks identified: 128 GB SanDisk M.2 SSD (Windows), 1 TB HGST hard drive, USB stick
- Arch on the SSD only: ext4, separate `/home`, zram swap with zstd, GRUB, no UKI
- Minimal profile, PipeWire, Bluetooth, NetworkManager, `git`; HyDE puts the desktop on top
- Hostname `ltp-crit-agi-01`, from a new device naming convention ([[arch-linux-02-device-hostnames]])
- HyDE installed: Chaotic-AUR, `yay`, zsh, every dot; NetworkManager, Bluetooth and SDDM enabled
- First boot into Hyprland on the GTX 970M, with the legacy NVIDIA driver HyDE picked
- Three catches: archinstall turned UKI on, the USB stick booted the installer again, and a hostname typo
- Reuse: `archinstall --config-url` replays the whole install on another computer

## Full command sequence

### Desktop · Read the setup to copy {local}
```local
lsblk -f  # -f: filesystems and mount points
grep -v '^#' /etc/fstab  # what mounts at boot
bootctl status  # firmware, Secure Boot, bootloader
pacman -Qqe  # -e explicit packages, -q names only
systemctl list-unit-files --state=enabled  # boot services
cat /etc/locale.conf /etc/vconsole.conf  # language, keymap
cat /etc/hostname  # machine name
readlink /etc/localtime  # timezone
cat /etc/systemd/zram-generator.conf  # zram swap
ls -d ~/.config/hyde  # exists: HyDE
```

{keep}
| Part | Desktop `arch-crit` | Laptop
| Disk | 1 GB EFI `/boot`, 32 GB ext4 `/`, rest ext4 `/home` | archinstall's default split of the same shape
| Swap | zram, zstd | same
| Bootloader | GRUB | GRUB, no UKI
| Region | `sv-latin1`, `en_US.UTF-8`, Europe/Stockholm | same
| Network | NetworkManager, wpa_supplicant backend | same
| Desktop | HyDE: Hyprland, uwsm, SDDM | HyDE, after the base install
| CPU microcode | `amd-ucode` | `intel-ucode` (Intel CPU)
| GPU driver | `nvidia-open-dkms` | `nvidia-580xx-dkms`: legacy, the card is too old for `nvidia-open`

> Gotcha · `nvidia-open` only supports newer NVIDIA cards. The GL702VT's card is a GTX 970M, which needs an older driver. HyDE picked the legacy `nvidia-580xx-dkms` itself, and Hyprland ran on it at first boot.

### Laptop · Boot from USB {remote}
1. Plug the USB stick in *before* powering on.
2. Tap `Esc` at power-on for the boot menu. Pick the `UEFI:` entry for the stick.
3. If it fails: `F2` → BIOS. Security → Secure Boot Control → Disabled. Boot → Fast Boot → Disabled. Save & Exit → Boot Override → the USB.
4. In the Arch menu, pick **Arch Linux install medium (x86_64, UEFI)**.

> Gotcha · If the screen goes black at boot, the NVIDIA card is the usual cause. In the Arch menu press `e`, add ` nomodeset` to the end of the line, and press Enter.

### Laptop · Prepare in the live system {remote}
```remote
loadkeys sv-latin1  # Swedish keyboard
ping -c 3 archlinux.org  # internet check; -c 3: three pings
cat /sys/firmware/efi/fw_platform_size  # 64: booted in UEFI mode
lsblk  # list disks, to pick the one to wipe
archinstall  # the menu installer
```
Before `loadkeys`, type `-` with the key right of `0`. An Ethernet cable is the quickest way to get internet. Wi-Fi needs `iwctl` first.

{keep}
| Path | Disk | Use
| `/dev/sda` | SanDisk M.2 SATA SSD, 119 GiB | Arch (Windows was here, wiped)
| `/dev/sdb` | HGST 2.5" HDD, 7200 rpm, 931.5 GiB | Untouched; games later
| `/dev/sdc` | Kingston DataTraveler 3.0, 14.4 GiB | The installer stick

### Laptop · archinstall menu {remote}
1. **Locales:** keyboard `sv-latin1`, language `en_US.UTF-8`
2. **Disk configuration:** best-effort layout, `/dev/sda` only, **ext4**, separate `/home`: yes. LVM: no. Encryption: no.
3. **Swap:** zram on, algorithm `zstd`
4. **Bootloader:** GRUB. Unified kernel images: **No**. Removable location: keep the default (on).
5. **Hostname:** `ltp-crit-agi-01`
6. **Authentication:** root password, then user `critonite` with sudo (superuser). Two passphrases, each saved in NordPass.
7. **Profile:** Minimal
8. **Applications:** Bluetooth on, Audio PipeWire
9. **Network configuration:** NetworkManager (default backend)
10. **Additional packages:** `git`
11. **Timezone:** Europe/Stockholm. Plymouth: skip.
12. **Install**, check the summary, confirm. Done in about 3 minutes.
13. **Reboot system**, and pull the USB stick out while the screen is dark.

> Concept · Minimal, not Desktop: HyDE installs Hyprland and SDDM itself, so a Desktop profile would add a clashing second set.
> Concept · zram is swap in compressed RAM: faster than a swap partition and no extra SSD writes.
> Best practice · A passphrase of 4–5 random words joined by `-`, from a generator. No å, ä, ö or symbols, since those keys move between Swedish and US layouts.

### Laptop · HyDE after the first login {remote}
```remote
sudo pacman -S --needed git base-devel  # skip installed
git clone --depth 1 https://github.com/HyDE-Project/HyDE ~/HyDE  # latest commit only
cd ~/HyDE/Scripts  # installer folder
./install.sh  # adds Chaotic-AUR, then asks below
```
1. **AUR helper:** `yay` (the default, also picked if the prompt times out)
2. **Shell:** `zsh` (the default). oh-my-zsh and its plugins come with it.
3. **Select dots to deploy:** `all` (9 sets: kitty, hyprlock, hypridle, swaync and more)
4. **Reboot now?** `n` here, then `sudo reboot` by hand. Pull the USB stick out first if it's still in.
5. At the SDDM login screen, pick the Hyprland session and log in.

> Gotcha · Two warnings at the end are expected on a first install. *Hyprland config not found*: there was none yet. *Failed to execute v26.4.3.sh*: migrations update older installs, and no notification service runs before the first login. Log: `~/.cache/hyde/logs/`.

{keep}
### Any computer · Replay the install {remote}
```remote
URL=https://raw.githubusercontent.com/<github-user>/arch-setup/main  # repo's raw files
archinstall --config-url $URL/user_configuration.json  # replay every choice
archinstall --config /path/to/user_configuration.json  # same, from a USB stick
```
Type only this command, not plain `archinstall` first. It formats the disk itself and asks for the passwords, which aren't in the file.

> Gotcha · The file names the disk as `/dev/sda`. On another computer that may be a different drive. Check the disk in the summary before confirming.

## Bugs hit & fixed

#### Bug · UKI turned on with GRUB
cause: The archinstall summary showed `"uki": true` under `bootloader_config`. The desktop doesn't use UKI, and GRUB with UKI is an unusual pair that can fail to boot.
fix: `Esc` back to the menu, Bootloader → Unified kernel images → No. The summary then showed `"uki": false`.

#### Bug · Rebooted into the installer again
cause: The USB stick was still in after **Reboot system**, so the laptop started the Arch install menu again instead of the SSD.
fix: Pull the stick out, then `Ctrl+Alt+Del`. Next time, pull it out while the screen is dark during the reboot.

#### Bug · Hostname typed as lpt-
cause: The shell prompt and fastfetch showed `lpt-crit-agi-01`. The convention is `ltp-` for laptop; the letters were swapped in the archinstall Hostname field.
fix: `sudo hostnamectl set-hostname ltp-crit-agi-01`, then `grep -n lpt /etc/hosts` and fix any hit. Log out and in to see it. The saved `user_configuration.json` has the typo too: fix `"hostname"` before replaying it.

{keep}
## Where things live
| What | Path
| Saved install choices | `/var/log/archinstall/user_configuration.json`
| Passwords from the install (never commit) | `/var/log/archinstall/user_credentials.json`
| Desktop's HyDE config | `~/.config/hyde`, `~/.local/share/hyde`
| zram settings | `/etc/systemd/zram-generator.conf`
| HyDE installer and its logs | `~/HyDE/Scripts`, `~/.cache/hyde/logs/`

{keep}
## Best practices
- **Copy, don't remember** Read the working machine's setup before installing a new one; it answers most menu questions.
- **Install on the SSD** Keep the system and `/home` on the fast drive; the hard drive becomes ext4 at `~/Games` for Lutris later.
- **Separate /home** A reinstall formats only `/boot` and `/`, then mounts `/home` unformatted, so files and settings survive.
- **Read the summary** archinstall's JSON summary is the last chance to catch a wrong default, like UKI.
- **Keep the config in Git** `user_configuration.json` plus a HyDE post-install script in an `arch-setup` repo; never the credentials file.

Part of Arch Linux · see [[arch-linux-02-device-hostnames]] for the hostname convention
