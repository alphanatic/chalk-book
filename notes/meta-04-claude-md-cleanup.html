## Bugs hit & fixed

#### Bug · grep with a context window failed
cause: `grep -o ".\{0,90\}word.\{0,90\}"` runs as ugrep here. On UTF-8 text it stops with `ugrep: error: error at position 83 … exceeds complexity limits`.
fix: Strip the tags in Python and slice the text around each match instead.
```local
python3 -c '...re.sub(r"<[^>]+>", " ", s)...'   # tags out, then slice around each hit
```

#### Bug · The pasted brief arrived cut short
cause: The paste ended at step 8, so the constraints never arrived. One of them said: if a fix makes the file grow, propose shorter wording. Change 5 added 210 bytes without that offer.
fix: Spotted from a screenshot of the full brief and reported against each constraint. Nothing else was broken: `chalk-pastel.css`, other notes and `archive/` stayed untouched.

#### Bug · Stale git step in the backlog
cause: The backlog's "how to work this list" still said "One commit per item … Push only when the user says so", after the git rules changed.
fix: It now says never commit `.handoffs/`, and any other git step follows the user's own preferences.

## Best practices

- **Investigate, then edit** A read-only phase with a proposal table lets the user cut changes before any file moves.
- **Measure the baseline** A hard size limit needs a number recorded before the first edit.
- **Verify every claim** Check suspected contradictions against the repo; one turned out false.
- **Ask before costly steps** Re-rendering the guide PDF waited for a decision; it was archived instead.
