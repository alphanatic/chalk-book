Cipher text on Home, a partial commit, and a deploy that ships only pushed work
The Coming soon list on Home now shows each unfinished project as scrambled glyphs that keep reshuffling, centred, one line each. Only that change was committed, out of two files full of other work, and it went live once it was pushed.

The deploy reads the chalk book from GitHub, not from disk: a local commit is not enough.

## What we covered
- Open `SOON` entries render as cipher text; spaces stay, so word shapes show
- A few glyphs swap every 90 ms; reduced motion gets a still scramble
- Monospace for the cipher lines, so reshuffling never changes their width
- Lines centred and kept on one row, growing past the section if needed
- Commit only one session's hunks with `git hash-object` + `git update-index`
- `check.sh` hex check hit a quoted code block: swapped in `var(--paper)`
- The company site's deploy takes the chalk book from pushed `origin/main` only

## Full command sequence

### Local · Scramble the open entries
```config: site/app.js
const CIPHER = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&*+=?@§¤ΔΣΩψλ";
const glyph = () => CIPHER[Math.floor(Math.random() * CIPHER.length)];
const encrypt = t => [...t].map(c => (c === " " ? " " : glyph())).join("");
li.classList.add("encrypted");
li.setAttribute("aria-label", "encrypted project");
setInterval(() => sealed.forEach(li => { … }), 90);
```
| Line | What it does
| `CIPHER`, `glyph` | The glyph pool and one random pick from it
| `encrypt` | Every letter becomes a glyph; spaces stay
| `aria-label` | Screen readers hear "encrypted project", not noise
| `setInterval` | Each tick swaps one glyph per line; skipped under reduced motion
---
> Concept · `el()` sets `textContent`, and `gitMark` is prepended, so `li.lastChild` is the text node. Changing `text.data` swaps glyphs without rebuilding the row.
> Gotcha · The real titles are still plain text in `SOON`. The scramble hides them on screen, not in the public source.

### Local · Keep the lines steady and centred
```config: site/app.css
.home .soon li.encrypted { font-family: ui-monospace, "DejaVu Sans Mono", monospace; }
.home .soon #soon-list { width: max-content; min-width: 100%;
  position: relative; left: 50%; transform: translateX(-50%); }
.home .soon #soon-list li { justify-content: center; white-space: nowrap; }
```
| Rule | What it does
| `li.encrypted` | Monospace: every glyph is the same width
| `#soon-list` | As wide as its longest line, at least the section, centred on it
| `#soon-list li` | Each line centred, never wrapped
> Gotcha · In the Kalam chalk font each glyph has its own width, so the centred list jittered on every tick.
> Concept · `margin: 0 auto` cannot centre a box wider than its parent; it overflows to the right. `left: 50%` plus `translateX(-50%)` centres on the parent whatever the width.

### Local · Commit only this session's hunks
Both files also held another session's work, some of it already staged.
```local
git restore --staged site/app.js  # unstage; the work stays on disk
git show HEAD:site/app.js > /tmp/app.js  # the committed version
python3 -I …  # copy only this session's blocks into it
h=$(git hash-object -w /tmp/app.js)  # -w: store it as a blob
git update-index --cacheinfo 100644,$h,site/app.js  # stage that blob
git diff --cached  # only the intended hunks?
```
> Best practice · Without `git add -p` (no interactive mode), a blob staged with `update-index` stages exactly what you choose.

### Local · Push, then publish
```local
git push origin HEAD:main  # the deploy only sees GitHub
infra/deploy.sh  # build, sync to S3, invalidate CloudFront
SITE=https://<company-site>  # the live site
curl -s $SITE/chalk-book/site/app.js | grep -c CIPHER  # live?
```

## Bugs hit & fixed

#### Bug · commit blocked by a note that wasn't in it
cause: `check.sh` scans every note on disk. An untracked note quoted another site's CSS that set `--bar-bg` to a hex value, and the rule `:\s*#[0-9a-fA-F]{3,6}` flagged it. `#c5beaf` on the line above passed: it follows a comma, not a colon.
fix: Replaced the hex with `var(--paper)` in the quote. The colour wasn't the point of that snippet.

#### Bug · published, but the change wasn't live
cause: The deploy runs `git archive origin/main` for the chalk book, so private and unpushed notes never go up. The commit was local only.
fix: Pushed the commit, then published again. `grep -c CIPHER` on the live file returned 2.

## Best practices
- **Push before you publish** A deploy that reads from GitHub ignores local commits.
- **Monospace for changing text** Live-updating text in a proportional font makes centred layouts jitter.
- **Stage blobs, not files** When a file mixes two sessions' work, stage a patched copy with `update-index`.

## For the web-skeleton
- **Publish a companion repo from `origin/main` only** Shipping a second repo by `git archive` of its pushed branch keeps unpushed and private files off the site by design.
