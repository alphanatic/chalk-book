## Full command sequence

### AWS Console · Lambda web app
1. Widget → **Create a web app using AWS Lambda** → **Start activity**
2. **Use a blueprint** → *Getting started with Lambda HTTP* (`nodejs22.x`)
3. Function name `dice-roll`, **Create default role**, code unchanged
4. **Function URL**: tick the acknowledgment (the URL is public) → **Create Event Function**
5. **Dismiss** the Getting started popup → click the **Function URL** link: *Hello from AWS Lambda!*
6. Console Home → refresh → **Completed**

> Concept · A **function URL** is an HTTPS address on the function itself: browser → Lambda → handler, with no API Gateway in between.

### Local · Same idea in a SAM project
```local
mv index.mjs lambda/  # into CodeUri
node -e 'import("./lambda/index.mjs").then(m => m.handler({})).then(console.log)'  # one local run
```
```config: ~/Projects/dice-roll-api/template.yaml
Resources:
  DiceRollFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs24.x
      CodeUri: lambda/
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  DiceRollUrl:
    Value: !GetAtt DiceRollFunctionUrl.FunctionUrl
```
| Change | Why
| `Events: Type: Api` removed | That built an API Gateway route; the activity asks for a function URL
| `FunctionUrlConfig`, `AuthType: NONE` | A public URL on the function itself
| `!GetAtt DiceRollFunctionUrl.FunctionUrl` | SAM names the URL resource `<function>Url`
> Concept · The handler doesn't change. Function URLs and API Gateway both pass `?sides=20` in `event.queryStringParameters`.

## Concepts

### Concept · What Bedrock is
| | Bedrock | Anthropic API directly
| Models | Many providers through one API | Claude only
| Billing | The AWS bill, so credits pay | A separate prepaid account
| Access | IAM roles, like Lambda | API keys
> Concept · Anthropic models on Bedrock are switched on by an **AWS Marketplace agreement**, one per model. No monthly fee; pay per token.

### Concept · A subscription isn't an API plan
- A Claude Pro or Max subscription covers your own use: claude.ai, the apps, Claude Code.
- It gives no API key and can't serve other people's prompts in an app.
- An app pays per token: the Anthropic API, or Bedrock on the AWS bill.
- The server holds the key or IAM role and calls the model; the browser never sees it.

## Bugs hit & fixed

#### Bug · Lambda activity still Not started
cause: The function was built, but the tutorial's last task, invoking the function URL, wasn't done yet.
fix: Open the **Function URL** once, then refresh Console Home. Start each later activity from the widget.

#### Bug · ServiceUnavailableException in the playground
cause: Claude Haiku 4.5 had only just been enabled: the use-case form and Marketplace agreement were minutes old.
fix: Switch to **Amazon → Nova Lite**. Amazon's own models need no form or agreement; any model counts.

## Best practices
- **Start from the widget** Click the activity, then Start activity, and finish the tutorial panel.
- **Do RDS first** It builds for minutes; do the budget and Bedrock while it runs.
- **Delete RDS the same day** Instance first, then cluster, no final snapshot.
- **Amazon models for quick tests** No forms, no agreements, instant access.
