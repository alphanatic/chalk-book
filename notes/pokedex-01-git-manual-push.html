From working folder to GitHub, by hand

Committed today's work in the `pokedex` repo by hand as `44e0d5c`, ready to push to GitHub `alphanatic/pokeggdex` over HTTPS.

Along the way, learned how `git status` reads the three places a file can be, how to shape commit messages and trailers, and what `.git/index` actually contains.

## What we covered

- The three places a file can be — working folder, index, HEAD — plus `origin` on GitHub
- A push routine: look first, then stage, commit and push
- Reading every section of `git status`, and the Starship prompt symbols
- Commit message shape, extra `-m` paragraphs, and trailers
- Inspected `.git/index` byte by byte with `xxd`
- Fixed tooling errors: missing `xxd`, unsynced pacman file lists, mirror 404s

## The big picture

### Concept · Three places a file can be
```html
<div class="cards four">
    <div class="local"><b>Working folder</b>your files on disk</div>
    <div class="best"><b>Index (staging)</b><code>.git/index</code> — the next commit</div>
    <div class="remote"><b>HEAD</b>your last commit</div>
    <div class="paths"><b>origin</b>GitHub's copy</div>
  </div>
```
> Concept · `git add` moves folder → index · `git commit` seals index → HEAD · `git push` sends HEAD → origin. `git status` compares them: folder ≠ index = red “not staged”, index ≠ HEAD = green “to be committed”.

## The push routine {local}

### Every push · Look before you touch {best}
```local
cd ~/Projects/pokedex  # go to the repo
git status  # what changed, what's staged
git remote -v  # which GitHub repo this folder talks to
git log --oneline -5  # last 5 commits, one line each
```

### Every push · Stage, commit, push {best}
```local
git add -A  # stage everything: modified, deleted, new
git status  # check: all green
git commit -m "Title" -m "Description."  # 1st -m = title, 2nd = body
git push  # HTTPS remote: username + access token
git status  # expect "up to date with 'origin/main'"
```

## Reading git status {paths}
| Section | Colour | Meaning | Move it with
| On branch / up to date | — | Where you stand vs GitHub | `git pull` / `push`
| Changes to be committed | green | Staged, goes in next commit | `git restore --staged`
| Changes not staged | red | Tracked, edited, left out | `git add`
| Untracked files | red | Git has never seen them | `git add` / `.gitignore`
```html
<p class="muted">Starship prompt shorthand: <code>»</code> renamed · <code>!</code> modified · <code>?</code> untracked ·
    <code>✘</code> deleted · <code>+</code> staged · <code>↑</code> ahead of GitHub (push me).</p>
```

## Commit messages {best}

```html
<div class="callout best"><b>Shape of a good message ·</b>
  <ul style="margin:4px 0 0; padding-left:18px">
    <li><b>Title:</b> one short line, sentence case, what changed, no full stop. Shown by <code>git log --oneline</code>.</li>
    <li><b>Body:</b> after a blank line — the what and why. Each extra <code>-m</code> = one more paragraph (no limit).</li>
    <li>One change per commit is best practice; <code>git add -A</code> for “everything at once” is fine when it all belongs together.</li>
  </ul>
</div>
```

```local
git commit -m "Lore page board, cabin and Pokédex updates" -m "Lore content now sits on a padded board, …"  # today's commit
```

### Concept · Trailers: `Key: value` lines in the last paragraph
| Trailer | Meaning
| `Co-Authored-By:` | Someone helped — GitHub shows both avatars
| `Signed-off-by:` | “I wrote it and may submit it” (Linux kernel style)
| `Reviewed-by` / `Tested-by` | Credit checkers and testers
| `Closes: #12` | Auto-closes GitHub issue 12
```local
git commit -s -m "Title"  # -s adds Signed-off-by
git commit -m "Title" --trailer "Closes: #12"  # any trailer, no extra -m
git log -1 --format='%(trailers)'  # show only trailers
```

## Inside .git/index (with xxd)

> Concept · The staging area is a real binary file: a list of path → content hash, plus each file's stat info (size, timestamps, inode) so `git status` can skip re-reading unchanged files. File contents live in `.git/objects`, not here.

```local
xxd .git/index | head -8  # first 128 bytes as hex
git ls-files --stage .gitignore  # Git's decoded view of one entry
git show :src/pokedex/pokedex.css  # ":" = the staged version of a file
```

{keep}
| Offset | Bytes (your repo) | Meaning
| `0x00` | `4449 5243` | “DIRC” — I'm a Git index
| `0x04` | `0000 0002` | Format version 2
| `0x08` | `0000 0059` | 89 tracked files
| `0x0c` | `6ac8 e401 …` | Entry 1 stat data: times, inode, mode 100644, uid 1000, size 18
| `0x34` | `f062 35c4 … 1b08` | Content hash (SHA-1) — the actual snapshot
| `0x48` | `000a` | Path is 10 characters
| `0x4a` | `2e67 6974 …` | “.gitignore” (first: entries sorted, “.” before letters)
| `0x54` | `0000 … 0000` | 1–8 NUL bytes, pads entry to a multiple of 8
```html
<p class="muted">Reading an xxd row: <b>left</b> = byte position · <b>middle</b> = bytes in hex · <b>right</b> = same bytes as text (dots = unprintable).</p>
```

## Bugs hit & fixed

#### Bug · git rmove -v
cause: A typo. Git suggests the closest real command (`remote`).
fix: Run the suggested `git remote -v`.

#### Bug · xxd: command not found
cause: `xxd` wasn't installed. zsh's helper searched pacman's file database: three packages provide it.
fix: Picked **tinyxxd** (smallest). The default choice (1) was **gvim** — don't just hit Enter.

#### Bug · database file for 'chaotic-aur' does not exist
cause: pacman's file lists had never been synced.
fix: Sync them:
```local
sudo pacman -Fy  # -F: file database, -y: refresh it
```

#### Bug · red 404s while installing
cause: The mirrors had moved to a newer version than the local package list.
fix: Do a full upgrade — never `-Sy` alone (partial upgrade):
```local
sudo pacman -Syu  # -S: sync, -y: refresh lists, -u: upgrade everything
```

```html
<div class="callout gotcha"><b>Gotcha ·</b>
  <ul style="margin:4px 0 0; padding-left:18px">
    <li><code>git commit -am</code> skips untracked files — it would have missed the new <code>pokedex.css</code>. Use <code>git add -A</code>.</li>
    <li>Unstaging a rename splits it into <code>deleted</code> + <code>untracked</code>; re-adding both rejoins it as <code>renamed (98%)</code>.</li>
    <li>HTTPS remote: GitHub wants a <b>personal access token</b>, not your password.</li>
  </ul>
</div>
```
