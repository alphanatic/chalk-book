Cross-cutting reference

Every naming pattern established across the lab so far — AWS resources, admin vs. service accounts, systemd units, and log/config files.

This file is a reference, not a walkthrough — check back here whenever you name something new in later days.

## Core philosophy {best}

```html
<p style="margin:0 0 4px">Every name should tell you, at a glance, <b>what it's for</b> and <b>what category it belongs to</b>:</p>
```

- `type` / `workload` / `env` / `region` fields for cloud resources
- `adm-` / `svc-` prefixes instantly separate a human's admin account from a service's unattended account
- Consistent 1:1 naming between a service and its supporting files (unit file, log folder, logrotate config) so nothing requires memory to trace

>{paths} Updated rule · Cloud naming moved to the professional pattern `<type>-<workload>-<env>-<region>-<instance>`, the widely used Microsoft Cloud Adoption Framework style. Patterns 1 and 2 show the old form crossed out. Day 1 resources still carry the old names, e.g. <span class="old">aws-lab-ubuntu-01</span>.

{keep}
## What each part means {paths}
| Part | The question it answers | In Tinker Town
| `type` | What kind of resource is it? | `vm`, `kp`, `vpc`, `snet`, `sg`: see the next table
| `workload` | What does it serve? | `ubuntu`, `web`, `core` (the network everything shares)
| `env` | Which environment is it in? | Always `lab`: the whole project is one lab
| `region` | Where does it run? | `eun1` (eu-north-1)
| `instance` | Which one of its kind? | `001`, `002`, …
> Key rule · `lab` is the environment, never the workload: `vpc-core-lab-eun1-001`, not `vpc-lab-dev-eun1-001`. Network examples for module 3: `vpc-core-lab-eun1-001`, `snet-public-lab-eun1-001`, `igw-core-lab-eun1-001`, `sg-web-lab-eun1-001`.

{keep}
## Common type prefixes {paths}
| Type | Prefix | Type | Prefix
| EC2 instance | `vm` | Security group | `sg`
| Key pair | `kp` | Subnet | `snet`
| VPC | `vpc` | Route table | `rt`
| Internet gateway | `igw` | NAT gateway | `nat`

## The patterns {paths}

```html
<ul class="steps">
  <li class="keep"><b>AWS resources (key pairs, VPCs, subnets, security groups…)</b>
    <code>&lt;type&gt;-&lt;workload&gt;-&lt;env&gt;-&lt;region&gt;-&lt;instance&gt;</code><br>
    <span class="muted">Type first so resources group in lists; short region codes. Example: <code>kp-ubuntu-lab-eun1-001</code><br>
    Replaces <span class="old">aws-&lt;env&gt;-&lt;purpose&gt;-&lt;id&gt;</span></span></li>
  <li class="keep"><b>EC2 instances</b>
    <code>vm-&lt;workload&gt;-&lt;env&gt;-&lt;region&gt;-&lt;instance&gt;</code><br>
    <span class="muted">Same rule with type <code>vm</code>. Example: <code>vm-ubuntu-lab-eun1-001</code><br>
    Replaces <span class="old">&lt;env&gt;-&lt;purpose&gt;-&lt;id&gt;</span></span></li>
  <li class="keep"><b>Personal sudo/admin username</b>
    <code>adm-kiwi</code><br>
    <span class="muted">Dots are invalid in Linux usernames — only letters, digits, <code>_</code> and <code>-</code>.</span></li>
  <li class="keep"><b>Service accounts</b>
    <code>svc-&lt;purpose&gt;</code><br>
    <span class="muted">No login shell, no sudo. Example: <code>svc-disk-report</code></span></li>
  <li class="keep"><b>Systemd unit files</b>
    <code>&lt;purpose&gt;.service</code><br>
    <span class="muted">No extra prefix — location + extension already say what it is. Example: <code>hello-loop.service</code></span></li>
  <li class="keep"><b>Log directories</b>
    <code>/var/log/&lt;service-name&gt;/&lt;service-name&gt;.log</code><br>
    <span class="muted">One dedicated folder per service. Example: <code>/var/log/disk-report/disk-report.log</code></span></li>
  <li class="keep"><b>Logrotate config files</b>
    <code>/etc/logrotate.d/&lt;service-name&gt;</code><br>
    <span class="muted">No extension — matches the <code>.d</code> folder convention. Example: <code>/etc/logrotate.d/disk-report</code></span></li>
</ul>
```

{keep}
## Quick reference {paths}
| What | Pattern | Example
| AWS resource | `<type>-<workload>-<env>-<region>-<instance>` | `kp-ubuntu-lab-eun1-001`
| EC2 instance | `vm-<workload>-<env>-<region>-<instance>` | `vm-ubuntu-lab-eun1-001`
| Personal admin user | `adm-kiwi` | `adm-kiwi`
| Service account | `svc-<purpose>` | `svc-disk-report`
| Systemd unit | `<purpose>.service` | `hello-loop.service`
| Log directory | `/var/log/<service-name>/` | `/var/log/disk-report/`
| Logrotate config | `/etc/logrotate.d/<service-name>` | `/etc/logrotate.d/disk-report`
