The backlog's look, showing only what is done

Rebuilt the private Complete Tasks page from the backlog's own styles and articles, filtered to items marked done. Then refined it step by step: renamed legacy items, a source-sorted overview, and a watermark tried and removed.

Both pages live in `.handoffs/`, which is gitignored, so none of this is committed.

## What we covered

- Complete Tasks rebuilt with the backlog's `<head>`, hero, legend, filter and filter script
- Done items copied unchanged from the backlog, each with a `.date` chip after its Done chip
- Sections by tier (Critical, Important), plus **Legacy** for the three pre-backlog items
- Legacy items renamed C12, C13, C16 → `L1`, `L2`, `L3`, with invented rank, platform and kind
- Overview sorted in the source: 1, 2, 4, 6, L1, L2, L3; no sort script
- Removed on request: the "For AI" callout, the Done date column, and a corner watermark
- A handoff file written for the next session: `.handoffs/handoff-2026-10-13c.md`

## How the page is put together

{keep}
| Part | Taken from | Change
| Styles, hero, legend | Backlog `<head>` and header | Status row shows only Done; adds `.date`
| Platform filter | Backlog filter and script | None
| Overview table | Backlog rows with `data-status="done"` | Same columns: # · Item · Rank · Platform · Kind · Status
| Item cards | Backlog `<article>`s, unchanged | A `<span class="date">` after the Done chip
| Card dates | The Done chip's `title` (hover time) | Never guessed; one came from the handoff file
> Concept · Copying the backlog's markup, not rewriting it, keeps both pages in step. A card reads the same on either page, and the shared filter script works unchanged.

## Sorting a list 0–9, a–z

{keep}
HTML has no built-in sort. Two ways:
| Way | When
| **Write it sorted in the source** | The list only changes by editing the file. No script; works from disk and in print
| **Sort on load with a script** | Rows may arrive in any order and must always end up sorted
```html
<div class="block local"><pre>const byNatural = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" }).compare;
const rows = [...table.querySelectorAll("tr")].slice(1);  <span class="cmt">// skip the header row</span>
rows.sort((a, b) =&gt; byNatural(a.cells[0].textContent, b.cells[0].textContent))
    .forEach(r =&gt; r.parentNode.appendChild(r));  <span class="cmt">// moves each row to the end, in order</span></pre></div>
```
| Plain text sort | Natural sort (`numeric: true`)
| 1, 10, 2, L01 | 1, 2, 10, L01
> Gotcha · Sorting the table alone leaves the cards below in the old order. Sort both, or sort neither and fix the source.

## Bugs hit & fixed

#### Bug · zsh ate a separator line
cause: `echo =====` failed with `(eval):1: ==== not found`. In zsh a word starting with `=` expands to a command's path, like `=ls` → `/usr/bin/ls`.
fix: Quote it, or use a separator that doesn't start with `=`.
```local
echo '====='  # quoted: printed as-is
```

#### Bug · legacy items ignored by the filter
cause: The filter hides elements by `data-platform`. The old items had none, so they showed under every filter.
fix: Gave each legacy card and overview row a `data-platform`, plus rank and kind chips.

#### Bug · two items, one new name
cause: The rename list mapped both C13 and C16 to `L03`. Duplicate ids break the overview links.
fix: Asked instead of guessing: C13 → L02, C16 → L03. Later shortened to L1–L3.

## Best practices

- **Copy, don't restyle** Reuse the sister page's markup so both stay in step.
- **Ask on a clash** A list that maps two things to one name gets a question, not a guess.
- **Screenshot to check** A headless render shows what a grep can't.
- **Remove fully** "All traces" means the CSS, the classes and the comments; grep to confirm.
