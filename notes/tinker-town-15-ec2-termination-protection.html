The safety net that stops a delete

Tried to terminate the stopped lab web server and AWS refused: termination protection was on. Turned it off on purpose, then the delete could go ahead. Also sorted out which EBS volumes belong to what.

A good safety net, and well done for having it on: deleting a server takes two deliberate steps, never one stray click.

## What we covered
- Terminate failed on `vm-web-prd-eun1-001` with a `disableApiTermination` error
- Termination protection is an instance attribute, off by default, switched on earlier
- Turned it off: **Actions → Instance settings → Change termination protection**
- Stop protection is a separate switch in the same menu
- The two EBS volumes: one in use by the server, one unattached Tinker Town leftover
- An unattached volume outlives any instance and must be deleted on its own

## Full command sequence

### AWS Console · Try to terminate
1. EC2 → **Instances** → tick `vm-web-prd-eun1-001` (stopped, `t4g.micro`)
2. **Instance state → Terminate (delete) instance** → refused (see the bug card)

### AWS Console · Turn termination protection off
1. Same instance ticked → **Actions → Instance settings**
2. **Change termination protection** → untick **Enable** → **Save**
3. **Instance state → Terminate (delete) instance** → confirm

### Local · The same from the CLI
```local
ID=<instance-id>  # target
aws ec2 describe-instance-attribute --instance-id $ID --attribute disableApiTermination  # is it on?
aws ec2 modify-instance-attribute --instance-id $ID --no-disable-api-termination  # off
aws ec2 terminate-instances --instance-ids $ID  # delete
aws ec2 modify-instance-attribute --instance-id $ID --disable-api-termination  # on again
```

{keep}
## The switches in Instance settings
| Setting | Blocks | Blocks when off
| Termination protection | Terminate from console, CLI and API | Nothing: one click deletes
| Stop protection | Stop from console, CLI and API | Nothing
| Shutdown behavior | Decides if `shutdown` inside the OS stops or terminates | —
> Gotcha · Termination protection does not stop `shutdown` from inside the OS when shutdown behavior is set to **Terminate**. Keep that on **Stop**.
> Concept · Protection guards against mistakes, not against permissions. Anyone who may change the attribute can still delete; it just takes a second, deliberate step.

{keep}
## The two EBS volumes
| Volume | Size | State | What it is
| `<root-volume-id>` | 8 GiB | In-use | The web server's root disk
| `<data-volume-id>` | 6 GiB | Available | Extra disk from [[tinker-town-06-storage-filesystems]], 2026-08-30, unattached
> Concept · A root volume has **Delete on termination** on by default, so it goes with the instance. A volume attached later, or detached, stays and costs until deleted: **EC2 → Volumes → Actions → Delete volume**. The serverless site (S3 + CloudFront) uses no EBS at all.

## Bugs hit & fixed

#### Bug · terminate refused
cause: `Failed to terminate (delete) an instance: The instance '<instance-id>' may not be terminated. Modify its 'disableApiTermination' instance attribute and try again.` Termination protection was on.
fix: Turned it off in **Actions → Instance settings → Change termination protection**, then terminated.

{keep}
## Best practices
- **Protect every server you'd miss** Turn termination protection on at launch, under Advanced details, for anything long-lived.
- **Check what depends on it first** Before deleting a server, list what still deploys to it or points at it.
- **Snapshot before deleting a volume** Deleting a volume can't be undone; a snapshot costs cents.
